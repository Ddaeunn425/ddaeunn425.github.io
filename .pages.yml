          "options": {
            "format": "html",
            "media": false
          }
        },
        {
          "name": "resources",
          "label": "07 관련 자료",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{title}"
            }
          },
          "fields": [
            {
              "name": "title",
              "label": "자료 이름",
              "type": "string"
            },
            {
              "name": "detail",
              "label": "파일 설명",
              "type": "string"
            },
            {
              "name": "file",
              "label": "파일 경로 또는 업로드",
