{
  "media": [
    {
      "name": "files",
      "label": "첨부 자료",
      "input": "media",
      "output": "/media",
      "categories": [
        "image",
        "document"
      ]
    }
  ],
  "content": [
    {
      "name": "home",
      "label": "내 정보·메인 화면",
      "type": "file",
      "path": "_data/home.json",
      "format": "json",
      "fields": [
        {
          "name": "name_ko",
          "label": "이름 (한글)",
          "type": "string",
          "required": true
        },
        {
          "name": "name_en",
          "label": "이름 (영문)",
          "type": "string",
          "required": true
        },
        {
          "name": "affiliation",
          "label": "소속·전공",
          "type": "string"
        },
        {
          "name": "headline",
          "label": "메인 제목 (줄바꿈 가능)",
          "type": "text"
        },
        {
          "name": "intro",
          "label": "메인 소개",
          "type": "text"
        },
        {
          "name": "bio",
          "label": "자기소개",
          "type": "text"
        },
        {
          "name": "interests",
          "label": "관심 분야",
          "type": "string"
        },
        {
          "name": "contact",
          "label": "공개 연락처",
          "type": "string"
        },
        {
          "name": "github_label",
          "label": "GitHub 표시 이름",
          "type": "string"
        },
        {
          "name": "github_url",
          "label": "GitHub 주소",
          "type": "string"
        },
        {
          "name": "notes",
          "label": "작업 노트 링크",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{title}"
            }
          },
          "fields": [
            {
              "name": "title",
              "label": "노트 제목",
              "type": "string"
            },
            {
              "name": "url",
              "label": "이동할 주소",
              "type": "string"
            }
          ]
        }
      ]
    },
    {
      "name": "projects",
      "label": "프로젝트 추가·관리",
      "type": "collection",
      "path": "_projects",
      "format": "yaml-frontmatter",
      "filename": {
        "template": "{primary}.md",
        "field": "create"
      },
      "view": {
        "primary": "title",
        "fields": [
          "title",
          "status"
        ]
      },
      "fields": [
        {
          "name": "title",
          "label": "프로젝트 이름",
          "type": "string",
          "required": true
        },
        {
          "name": "status",
          "label": "진행 상태",
          "type": "string",
          "default": "진행 중"
        },
        {
          "name": "icon",
          "label": "아이콘",
          "type": "string",
          "default": "📁"
        },
        {
          "name": "description",
          "label": "한 줄 소개",
          "type": "text"
        },
        {
          "name": "order",
          "label": "목록 순서 (작을수록 먼저)",
          "type": "number",
          "default": 10
        },
        {
          "name": "layout",
          "label": "페이지 양식",
          "type": "string",
          "readonly": true,
          "default": "project"
        },
        {
          "name": "link",
          "label": "기존 프로젝트 연결 주소",
          "type": "string",
          "readonly": true
        },
        {
          "name": "body",
          "label": "프로젝트 본문 (HSU-PAC 구축 내용은 별도 메뉴에서 수정)",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": false
          }
        }
      ],
      "operations": {
        "rename": false
      }
    },
    {
      "name": "hsu",
      "label": "HSU-PAC 구축 노트",
      "type": "file",
      "path": "_data/hsu.json",
      "format": "json",
      "fields": [
        {
          "name": "subtitle",
          "label": "페이지 한 줄 설명",
          "type": "text"
        },
        {
          "name": "author",
          "label": "작성자·소속",
          "type": "string"
        },
        {
          "name": "basis",
          "label": "자료 기준",
          "type": "string"
        },
        {
          "name": "updated",
          "label": "최종 정리일",
          "type": "string"
        },
        {
          "name": "summary",
          "label": "상단 핵심 요약",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": false
          }
        },
        {
          "name": "overview",
          "label": "01 현재 기준",
          "type": "rich-text",
          "options": {
            "format": "html",
            "media": false
          }
        },
        {
          "name": "phases",
          "label": "02 1·2·3차 로드맵",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{title}"
            }
          },
          "fields": [
            {
              "name": "label",
              "label": "단계 이름",
              "type": "string"
            },
            {
              "name": "title",
              "label": "단계 목표",
              "type": "string"
            },
            {
              "name": "body",
              "label": "도입 장비와 할 일",
              "type": "rich-text",
              "options": {
                "format": "html",
                "media": false
              }
            },
            {
              "name": "amount",
              "label": "참고 예산 설명",
              "type": "text"
            },
            {
              "name": "note",
              "label": "조건·유의사항",
              "type": "text"
            }
          ]
        },
        {
          "name": "equipment_intro",
          "label": "03 장비 선정 설명",
